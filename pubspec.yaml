name: sr_robot_app
description: "Frontend móvil multiplataforma Sr Robot"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado, navegación y red
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI, fuentes y formato
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  intl: any
  cached_network_image: ^3.4.1

  # Mapa (OpenStreetMap, sin API key)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Servicios nativos
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
